# Production Environment Properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pdfworkspace_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.pool-name=PdfWorkspaceHikariPoolProd

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Overrides via ENV
app.jwt.secret=${JWT_SECRET:dGVzdF9zZWNyZXRfa2V5X2Zvcl9wZGZfd29ya3NwYWNlX2FkbWluX2F1dGhfMjAyNl9zdXBlcl9zZWN1cmU=}

# Logging
logging.level.com.pdfworkspace=INFO
logging.level.org.springframework.web=WARN
