# Roriri Workspace Backend Main Configuration
spring.profiles.active=dev
spring.application.name=pdf-workspace-backend

# Multipart Upload Limits (100MB max per file/request)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Storage & Temp file configuration
app.storage.temp-dir=${java.io.tmpdir}/pdf-workspace-temp
app.storage.temp-file-ttl-minutes=15

# JWT Secret & Expiration for Admin Auth
app.jwt.secret=dGVzdF9zZWNyZXRfa2V5X2Zvcl9wZGZfd29ya3NwYWNlX2FkbWluX2F1dGhfMjAyNl9zdXBlcl9zZWN1cmU=
app.jwt.expiration-ms=86400000

# Server Port
server.port=8080
